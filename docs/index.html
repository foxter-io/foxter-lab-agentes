<title>Foxter LAB #2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&display=swap">
<style>
/* Layout: guía de taller a pantalla completa. Barra superior (marca + filtro de agente), una diapositiva visible cada vez, barra inferior de navegación. En cada paso se ven solo las instrucciones del agente elegido, con Claude Code y Codex juntos. */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --fg:#131313; --fg2:#57575A; --fg3:#8A8A8D;
  --line:rgba(19,19,19,.10); --line2:rgba(19,19,19,.20);
  --ink:#080808; --on-ink:#F6F6F4; --on-ink-2:#A9A9AD; --ink-line:rgba(246,246,244,.14);
  --purple:#6801FE; --purple-text:#6801FE; --purple-soft:rgba(104,1,254,.08);
  --gold:#E1AC23; --gold-text:#8A6A0E; --orange:#F39C12;
  --clara:#6801FE; --clara-on:#FFFFFF; --clara-text:#6801FE; --clara-soft:rgba(104,1,254,.07);
  --max:#E1AC23;   --max-on:#131313;   --max-text:#7A5C08;   --max-soft:rgba(225,172,35,.12);
  --otto:#080808;  --otto-on:#F6F6F4;  --otto-text:#131313;  --otto-soft:rgba(19,19,19,.045);
  --mara:#1F9D6B; --mara-on:#FFFFFF; --mara-text:#16794F; --mara-soft:rgba(31,157,107,.09);
  --diana:#E2665A; --diana-on:#FFFFFF; --diana-text:#B8463B; --diana-soft:rgba(226,102,90,.10);
  --code-bg:#F3F1FA;
  --shadow:0 1px 3px rgba(19,19,19,.06),0 8px 24px rgba(19,19,19,.06);
  --halo:rgba(104,1,254,.08);
  --grad-text:linear-gradient(90deg,#F39C12 0%,#E1AC23 45%,#6801FE 100%);
  --font-h:"monument-extended","Sora","Helvetica Neue",Arial,sans-serif;
  --font-b:"Sora","Helvetica Neue",Arial,sans-serif;
  --font-m:ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --r-sm:8px; --r-md:14px; --r-lg:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0C0D; --surface:#17171A; --fg:#F6F6F4; --fg2:#B4B4B8; --fg3:#86868B;
  --line:rgba(246,246,244,.10); --line2:rgba(246,246,244,.22);
  --ink:#050505; --ink-line:rgba(246,246,244,.16);
  --purple-text:#A577FF; --purple-soft:rgba(104,1,254,.20); --gold-text:#E1AC23;
  --clara-text:#A577FF; --clara-soft:rgba(104,1,254,.16);
  --max-text:#E8BC4A; --max-soft:rgba(225,172,35,.12);
  --otto:#F6F6F4; --otto-on:#080808; --otto-text:#F6F6F4; --otto-soft:rgba(246,246,244,.06);
  --mara-text:#4CC795; --mara-soft:rgba(31,157,107,.16); --diana-text:#F08A80; --diana-soft:rgba(226,102,90,.16);
  --code-bg:#1F1D26; --shadow:0 0 0 1px rgba(246,246,244,.06); --halo:rgba(104,1,254,.18);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0D; --surface:#17171A; --fg:#F6F6F4; --fg2:#B4B4B8; --fg3:#86868B;
  --line:rgba(246,246,244,.10); --line2:rgba(246,246,244,.22);
  --ink:#050505; --ink-line:rgba(246,246,244,.16);
  --purple-text:#A577FF; --purple-soft:rgba(104,1,254,.20); --gold-text:#E1AC23;
  --clara-text:#A577FF; --clara-soft:rgba(104,1,254,.16);
  --max-text:#E8BC4A; --max-soft:rgba(225,172,35,.12);
  --otto:#F6F6F4; --otto-on:#080808; --otto-text:#F6F6F4; --otto-soft:rgba(246,246,244,.06);
  --mara-text:#4CC795; --mara-soft:rgba(31,157,107,.16); --diana-text:#F08A80; --diana-soft:rgba(226,102,90,.16);
  --code-bg:#1F1D26; --shadow:0 0 0 1px rgba(246,246,244,.06); --halo:rgba(104,1,254,.18);
  color-scheme:dark}

@font-face{font-family:"monument-extended";src:url("fonts/monument-regular.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"monument-extended";src:url("fonts/monument-ultrabold.otf") format("opentype");font-weight:800;font-display:swap}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--purple);outline-offset:3px;border-radius:6px}
h1,h2,h3,p,ol,ul{margin:0}
ul,ol{padding:0;list-style:none}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;width:100%}

/* Shell */
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.bar{border-bottom:1px solid var(--line);background:var(--bg)}
.bar__in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.logo{display:inline-flex;align-items:center;gap:12px;color:var(--fg);min-height:40px}
.logo svg{height:15px;width:auto;display:block}
.logo span{font-family:var(--font-h);font-size:11px;letter-spacing:.06em;color:var(--fg2);padding-left:12px;border-left:1px solid var(--line2);line-height:1.2}
.draft{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--max-soft);color:var(--gold-text);border:1px solid rgba(225,172,35,.45)}
.spacer{flex:1}
.filter{display:inline-flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--line2);border-radius:999px;max-width:100%;overflow-x:auto}
.filter__lbl{font-size:12px;color:var(--fg2);padding:0 6px 0 10px}
.filter button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;transition:background-color .2s,color .2s}
.filter button svg{width:22px;height:22px}
.filter button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.iconbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);font-size:13px;font-weight:500}
.iconbtn:hover{border-color:var(--fg)}

.stage{overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
.slide{min-height:100%;padding-block:clamp(24px,4vh,48px) 40px}
.slide:not([hidden]){animation:in .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}

.nav{border-top:1px solid var(--line);background:var(--bg)}
.nav__in{display:flex;align-items:center;gap:16px;padding-block:10px}
.navbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-sm);font-size:14px;font-weight:500;border:1px solid var(--line2);white-space:nowrap}
.navbtn--next{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 7px 24px 0 rgba(104,1,254,.28)}
.navbtn--next:hover{background:#7a15ff}
.navbtn:disabled{opacity:.35;cursor:default;box-shadow:none}
.navmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.navmid__txt{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--fg2)}
.navmid__txt b{font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--grad-text);transition:width .3s}

/* Type */
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.eyebrow::before{content:"";width:24px;height:1px;background:currentColor;opacity:.7}
.h-title{font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:clamp(24px,3.2vw,44px);line-height:1.12;letter-spacing:0;text-wrap:balance;max-width:24ch}
.em{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding:0 .06em}
.lead{font-size:clamp(16px,1.35vw,20px);font-weight:300;color:var(--fg2);max-width:62ch}
.head{display:flex;flex-direction:column;gap:14px;margin-bottom:clamp(20px,3vh,36px)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);color:var(--fg)}
.chip--purple{background:var(--purple-soft);border-color:rgba(104,1,254,.30);color:var(--purple-text)}
.chip--time{font-variant-numeric:tabular-nums}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,2vw,28px);box-shadow:var(--shadow);min-width:0}
.card--halo{position:relative;overflow:hidden}
.card--halo::before{content:"";position:absolute;inset:0;background:radial-gradient(520px circle at 0% 0%,var(--halo),transparent 45%);pointer-events:none}
.card h3{font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:clamp(15px,1.2vw,18px);line-height:1.25;margin-bottom:8px}
.card p{color:var(--fg2);font-size:15px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* Cover */
.cover{background:var(--ink);color:var(--on-ink);border-radius:var(--r-lg);padding:clamp(28px,5vw,64px);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);align-items:end;border:1px solid var(--ink-line)}
.tbd{min-height:62vh;display:grid;place-items:center;border:1.5px dashed var(--line2);border-radius:var(--r-lg);background:var(--surface);font-family:var(--font-h);text-transform:uppercase;font-size:clamp(32px,5vw,72px);color:var(--fg3);letter-spacing:.04em}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(800px circle at 0% 0%,rgba(104,1,254,.35),transparent 50%),radial-gradient(600px circle at 100% 100%,rgba(225,172,35,.16),transparent 50%);pointer-events:none}
.cover > *{position:relative}
.cover__logo{display:block;color:var(--on-ink);height:20px;width:auto;margin-bottom:clamp(28px,6vh,72px)}
.cover h1{font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:clamp(32px,5.4vw,78px);line-height:1.04;text-wrap:balance;margin-block:16px 22px}
.cover .lead{color:var(--on-ink-2)}
.cover__facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.cover__facts span{padding:7px 14px;border:1px solid var(--ink-line);border-radius:999px;font-size:13px;color:var(--on-ink)}
.cover__team{display:flex;gap:10px;margin-top:28px}
.cover__team svg{width:64px;height:64px}
.cover__team svg{--surface:var(--ink)}
.cover .a-otto{--a:var(--on-ink);--a-on:var(--ink)}
.qrbox{background:#F6F6F4;color:#131313;border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:280px;justify-self:end;width:100%}
.qr{width:150px;height:150px;display:grid;place-items:center;background:#F6F6F4}
.qr img,.qr canvas,.qr svg{width:150px!important;height:150px!important}
.qrbox b{font-weight:600;font-size:14px}
.qrbox small{font-size:12px;color:#57575A;word-break:break-all}
.qr--pending{border:1.5px dashed rgba(19,19,19,.3);border-radius:10px;font-size:12px;color:#57575A;text-align:center;padding:10px}

/* Agenda */
.agenda{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.agenda li{display:grid;grid-template-columns:90px minmax(0,220px) minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 22px;border-top:1px solid var(--line)}
.agenda li:first-child{border-top:0}
.agenda .t{font-variant-numeric:tabular-nums;font-weight:500}
.agenda .b{font-weight:500}
.agenda .d{color:var(--fg2);font-size:15px}
.agenda li.hands{background:var(--purple-soft)}
.agenda .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-text);white-space:nowrap}

/* LAB 1 -> 2 */
.bridge{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:stretch}
.bridge__arrow{display:grid;place-items:center;color:var(--fg3)}
.bridge__arrow svg{width:40px;height:40px}
.lab-num{font-family:var(--font-h);font-size:13px;letter-spacing:.06em;color:var(--fg3);margin-bottom:14px;display:block}
.big-line{font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:clamp(18px,1.8vw,26px);line-height:1.2;margin-bottom:12px}

/* Pieces */
.piece{display:flex;flex-direction:column;gap:10px}
.piece__ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--purple-soft);color:var(--purple-text)}
.piece__ico svg{width:22px;height:22px}
.piece__where{margin-top:auto;font-family:var(--font-m);font-size:12.5px;color:var(--fg);background:var(--code-bg);padding:6px 9px;border-radius:6px;align-self:flex-start;word-break:break-word}

/* Agents */
.agents{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.agent{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.agent__top{display:flex;align-items:center;gap:12px;padding:16px;background:var(--a-soft);border-bottom:3px solid var(--a)}
.agent__top svg{width:56px;height:56px;flex:none}
.agent__name{font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:clamp(17px,1.5vw,22px);line-height:1;color:var(--a-text)}
.agent__role{font-size:13px;font-weight:500;color:var(--fg);margin-top:6px}
.agent__tag{font-size:13px;color:var(--fg2)}
.agent__body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;font-size:14.5px}
.kv dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding-top:3px}
.kv dd{margin:0;color:var(--fg2)}
.agent .kv{grid-template-columns:minmax(0,1fr);gap:2px}
.agent .kv dd{margin-bottom:10px;font-size:14px}
.a-clara{--a:var(--clara);--a-on:var(--clara-on);--a-text:var(--clara-text);--a-soft:var(--clara-soft)}
.a-max{--a:var(--max);--a-on:var(--max-on);--a-text:var(--max-text);--a-soft:var(--max-soft)}
.a-otto{--a:var(--otto);--a-on:var(--otto-on);--a-text:var(--otto-text);--a-soft:var(--otto-soft)}
.a-mara{--a:var(--mara);--a-on:var(--mara-on);--a-text:var(--mara-text);--a-soft:var(--mara-soft)}
.a-diana{--a:var(--diana);--a-on:var(--diana-on);--a-text:var(--diana-text);--a-soft:var(--diana-soft)}

/* Steps */
.instr{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.instr li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;font-size:clamp(15px,1.15vw,17px)}
.instr li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--fg);color:var(--bg)}
.kbd{font-family:var(--font-m);font-size:.88em;background:var(--code-bg);padding:2px 7px;border-radius:5px;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.col{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--a);box-shadow:var(--shadow);min-width:0}
.col__head{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
.col__head svg{width:46px;height:46px;flex:none}
.col__name{font-family:var(--font-h);text-transform:uppercase;font-size:18px;line-height:1;color:var(--a-text)}
.col__role{font-size:12.5px;color:var(--fg2);margin-top:4px}
.col__body{padding:10px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.prompt{position:relative;background:var(--a-soft);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 52px;min-width:0}
.prompt--solo{--a-soft:var(--purple-soft)}
.ptext{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--font-b);font-weight:400;font-size:clamp(14.5px,1.1vw,17px);line-height:1.5;color:var(--fg)}
.copy{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;background:var(--fg);color:var(--bg);transition:transform .15s}
.copy:hover{transform:translateY(-1px)}
.copy svg{width:15px;height:15px}
.copy.done{background:#2ECC71;color:#0b2a17}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14px;color:var(--fg2);margin-top:auto}
.check svg{width:20px;height:20px;color:#1E9E55}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding:14px 18px;border-radius:var(--r-md);border:1px dashed var(--line2);font-size:15px;color:var(--fg2)}
.note b{color:var(--fg);font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(18px,3vw,40px);align-items:start}
.inline-copy{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline-copy .copy{position:static;min-height:28px;padding:0 10px;font-size:12px}

/* Filtro: un agente */
.app[data-filter="mara"] .ag-pane:not(.a-mara),.app[data-filter="max"] .ag-pane:not(.a-max),.app[data-filter="clara"] .ag-pane:not(.a-clara),.app[data-filter="otto"] .ag-pane:not(.a-otto),.app[data-filter="diana"] .ag-pane:not(.a-diana){display:none}
.app[data-filter="mara"] .agent:not(.a-mara),.app[data-filter="max"] .agent:not(.a-max),.app[data-filter="clara"] .agent:not(.a-clara),.app[data-filter="otto"] .agent:not(.a-otto),.app[data-filter="diana"] .agent:not(.a-diana){opacity:.35}
.app[data-filter="none"] .ag-pane{display:none}
.app:not([data-filter="none"]) .need-agent{display:none}
.agent[data-f]{cursor:pointer;transition:opacity .2s,transform .2s}
.agent[data-f]:hover{transform:translateY(-2px)}
.need-agent{display:flex;flex-direction:column;gap:14px}
.need-agent p{color:var(--fg2)}
.need-agent b{color:var(--fg);font-weight:500}
.need-agent__btns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pickbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-top:4px solid var(--a);border-radius:var(--r-md);text-align:left;background:var(--surface)}
.pickbtn:hover{background:var(--a-soft)}
.pickbtn svg{width:40px;height:40px;flex:none}
.pickbtn b{display:block;font-family:var(--font-h);font-weight:400;text-transform:uppercase;font-size:14px;color:var(--a-text)}
.pickbtn small{font-size:12px;color:var(--fg2)}
.ag-pane{display:flex;flex-direction:column;gap:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--a);box-shadow:var(--shadow);padding:14px 18px 18px}
.ag-pane__h{display:flex;align-items:center;gap:12px}
.ag-pane__h svg{width:46px;height:46px;flex:none}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.tools--one{grid-template-columns:minmax(0,1fr)}
.tool{display:flex;flex-direction:column;gap:12px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg)}
.tool__h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.split--mid{align-items:center}
.lu{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--ink-line);background:#2C2477;box-shadow:var(--shadow);max-width:560px;width:100%;justify-self:end}
.lu__vid{display:block;width:100%;aspect-ratio:1;object-fit:cover;image-rendering:pixelated}
.lu__link{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:999px;background:rgba(8,8,8,.82);color:#F6F6F4;font-size:14px;font-weight:500;backdrop-filter:blur(6px)}
.lu__link .copy{position:static;min-height:30px;padding:0 12px;font-size:12px;background:#F6F6F4;color:#131313}
/* Diapositivas con poco contenido: centradas en vertical */
.slide:not([hidden]){display:flex;flex-direction:column}
.slide > .wrap{margin-block:auto}

/* Lists */
.ticks{display:flex;flex-direction:column;gap:12px}
.ticks li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:clamp(15px,1.15vw,17px)}
.ticks li svg{width:22px;height:22px;color:var(--purple-text);margin-top:2px}

.index h4{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:18px 0 6px}
.index button.it{display:flex;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-sm);font-size:14.5px}

  if(s.sec !== lastSec){ html += "<h4>"+esc(s.sec)+"</h4>"; lastSec = s.sec; }

});

/* Navegación */
var cur = 0, slides = stage.querySelectorAll(".slide");
var prevB = document.getElementById("prev"), nextB = document.getElementById("next");
function show(i, fromHash){
  i = Math.max(0, Math.min(S.length-1, i));
  slides[cur].hidden = true; cur = i; slides[cur].hidden = false;
  stage.scrollTop = 0;
  document.getElementById("count").textContent = (cur+1)+" / "+S.length;
  document.getElementById("secName").textContent = S[cur].sec + " · " + S[cur].label;
  document.getElementById("progBar").style.width = ((cur+1)/S.length*100)+"%";
  prevB.disabled = cur === 0; nextB.disabled = cur === S.length-1;
  Array.prototype.forEach.call(list.querySelectorAll(".it"), function(b){ b.setAttribute("aria-current", String(+b.getAttribute("data-go")===cur)); });
  if(!fromHash && location.hash !== "#"+S[cur].id){ try{ history.replaceState(null,"","#"+S[cur].id); }catch(e){ location.hash = S[cur].id; } }
}
function fromHash(){
  var id = (location.hash||"").slice(1), i = 0;
  S.forEach(function(s,k){ if(s.id===id) i = k; });
  show(i, true);
}
slides[0].hidden = false;
fromHash();
window.addEventListener("hashchange", fromHash);
prevB.addEventListener("click", function(){ show(cur-1); });
nextB.addEventListener("click", function(){ show(cur+1); });
document.addEventListener("keydown", function(e){
  if(!idx.hidden){ if(e.key==="Escape") closeIdx(); return; }
  var t = e.target && e.target.tagName;
  if(t==="INPUT"||t==="TEXTAREA"||(e.target.isContentEditable)) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"||(e.key===" "&&t!=="BUTTON")){ e.preventDefault(); show(cur+1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); show(cur-1); }
  else if(e.key==="Home"){ show(0); } else if(e.key==="End"){ show(S.length-1); }
});

var idx = document.getElementById("index");
function openIdx(){ idx.hidden = false; var c = list.querySelector("[aria-current='true']"); (c||list.querySelector(".it")).focus(); }
function closeIdx(){ idx.hidden = true; document.getElementById("openIndex").focus(); }
document.getElementById("openIndex").addEventListener("click", openIdx);
document.getElementById("closeIndex").addEventListener("click", closeIdx);
idx.addEventListener("click", function(e){
  var b = e.target.closest("[data-go]");
  if(b){ show(+b.getAttribute("data-go")); idx.hidden = true; return; }
  if(e.target === idx) closeIdx();
});

/* Filtro de agente */
var app = document.getElementById("app");
function setFilter(f){
  if(KEYS.indexOf(f) < 0) return;
  app.setAttribute("data-filter", f);
  Array.prototype.forEach.call(document.querySelectorAll(".filter [data-f]"), function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-f")===f)); });
  try{ localStorage.setItem("lab2-agent", f); }catch(e){}
}
document.addEventListener("click", function(e){ var b = e.target.closest("[data-f]"); if(b) setFilter(b.getAttribute("data-f")); });
document.addEventListener("keydown", function(e){ if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches("article[data-f]")){ e.preventDefault(); setFilter(e.target.getAttribute("data-f")); } });
try{ var saved = localStorage.getItem("lab2-agent"); if(saved) setFilter(saved); }catch(e){}

/* Copiar */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-copy],[data-copy-text]");
  if(!b) return;
  var pre = b.hasAttribute("data-copy-text") ? null : b.closest(".prompt").querySelector(".ptext");
  var text = pre ? pre.textContent : b.getAttribute("data-copy-text");
  function ok(){ var s = b.querySelector("span"); b.classList.add("done"); s.textContent = "Copiado"; setTimeout(function(){ b.classList.remove("done"); s.textContent = "Copiar"; }, 1600); }
  function fallback(){
    if(pre){ var r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
    try{ if(document.execCommand("copy")) { ok(); return; } }catch(err){}
    var s = b.querySelector("span"); s.textContent = "Selecciona y copia";
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); }
    else fallback();
  }catch(err){ fallback(); }
});
